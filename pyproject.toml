[project]
name = "mlops-sample"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.4",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
python-preference = "only-system"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["api/tests"]
addopts = "-ra"

